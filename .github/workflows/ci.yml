name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (core + dev)
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check src scripts tests

      - name: Run unit & safety tests
        run: uv run pytest tests/test_repo_safety.py tests/test_path_c_leakage.py tests/test_spatial_conformal.py
