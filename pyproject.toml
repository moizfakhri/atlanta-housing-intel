[project]
name = "atlanta-housing-intel"
version = "0.1.0"
description = "Metro Atlanta suburban real estate liquidity, valuation, alt-data catalysts, and streetscape intelligence platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.10.0",
    "pyarrow>=17.0.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyogrio>=0.9.0",
    "h3>=4.1.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "rich>=13.9.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]
ml-deep = [
    "torch>=2.4.0",
    "mlflow>=2.17.0",
    "lifelines>=0.29.0",
]
de = [
    "dagster>=1.8.0",
    "dbt-duckdb>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atl_housing"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
